# profile-ping — tell the profile repository (h0ffmann/h0ffmann) that a pull request was merged, so
# its "recent activity" list is rebuilt minutes after the merge instead of at the next daily cron.
# Push, not poll: one `repository_dispatch` (event_type `activity`) per merge, ~5 s of runner time.
#
# Reusable. A consumer adds .github/workflows/profile-activity.yml:
#
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#   jobs:
#     ping:
#       if: github.event.pull_request.merged
#       uses: h0ffmann/nix-config/.github/workflows/profile-ping.yml@main
#       secrets:
#         token: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
#
# PROFILE_DISPATCH_TOKEN: a fine-grained PAT with Contents: read & write on the profile repository
# only (repository_dispatch needs it; GITHUB_TOKEN cannot reach another repository). Unset — a fork,
# a new repository — is a notice, never a failure.
#
# The payload is what the profile renders anyway (repository, PR number, visibility, merge time),
# no title or branch: the profile's Actions logs are public, and marola is private.
name: profile ping

on:
  workflow_call:
    inputs:
      profile:
        description: Repository whose activity section is rebuilt.
        type: string
        default: h0ffmann/h0ffmann
    secrets:
      token:
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: repository_dispatch activity -> ${{ inputs.profile }}
        env:
          TOKEN: ${{ secrets.token }}
          PROFILE: ${{ inputs.profile }}
          REPO: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
          NUMBER: ${{ github.event.pull_request.number }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::notice::PROFILE_DISPATCH_TOKEN is not set in $REPO — skipping; the profile's daily cron still catches this merge"
            exit 0
          fi
          body="$(jq -nc --arg repo "$REPO" --arg number "${NUMBER:-0}" --arg private "$PRIVATE" --arg merged_at "$MERGED_AT" \
            '{event_type: "activity", client_payload: {repo: $repo, number: ($number | tonumber), private: ($private == "true"), merged_at: $merged_at}}')"
          code="$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PROFILE/dispatches" -d "$body")"
          if [ "$code" != 204 ]; then
            echo "::warning::dispatch to $PROFILE answered HTTP $code: $(head -c 300 response.txt)"
            exit 0
          fi
          echo "dispatched activity for $REPO#${NUMBER:-?} to $PROFILE"
