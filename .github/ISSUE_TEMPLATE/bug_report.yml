name: Bug report
description: A lab, a script or the VM is broken. For the repo's own tooling or docs, use Task instead.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error or wrong output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The `just` or `nix` command, run from which directory.
      placeholder: |
        cd labs/pratico && just smoke
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Ubuntu + Determinate Nix
        - NixOS
        - just vm
        - macOS
        - CI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
